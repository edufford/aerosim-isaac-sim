########################################################################################################################
# Repo tool base settings
########################################################################################################################

[repo]

# Use the Kit Template repo configuration as a base. Only override things specific to the repo.
import_configs = [
    "${root}/_repo/deps/repo_kit_tools/kit-template/repo.toml",
    "${root}/_repo/deps/repo_kit_tools/kit-template/repo-external-app.toml",
]

# Repository Name
name = "aerosim-isaac-sim"

[repo_build]
post_build.commands = []
licensing.enabled = false

# Ensure source/apps directory exists before build
fetch."platform:linux-x86_64".before_pull_commands = [
    ["mkdir", "--parents", "${root}/source/apps"],
]

# Extend the packman target files to also pull USD for the extension's C++ compilation
fetch.packman_target_files_to_pull = [
    "${root}/tools/deps/kit-sdk.packman.xml",
    "${root}/tools/deps/kit-sdk-deps.packman.xml",
    "${root}/deps/ext-deps.packman.xml",
]

[repo_build.build]
enabled = true

[repo_build.msbuild]
# auto-configured by build.bat - do not edit manually
link_host_toolchain = true
vs_version = "vs2019" # premake5 action for PlatformToolset=v142; USD Boost deps are vc142
vs_path = "C:\\Program Files\\Microsoft Visual Studio\\18\\Community" # VS2026 install with v142 toolchain
msvc_version = "v142" # MSVC 14.29 → _MSC_VER<1930 → Boost vc142 (matches USD deps)

[repo_build.docker]
enabled = false

[repo_build.fetch.pip]
files_to_pull = [
    "${root}/tools/deps/pip.toml"
]
licensing_enabled = false
publish_pip_cache = false

########################################################################################################################
# Extensions precacher
########################################################################################################################

[repo_precache_exts]
apps = [
    "${root}/source/apps/aerosim.isaac.renderer.kit",
    "${root}/source/apps/aerosim.isaac.renderer.dev.kit",
]

registries = [
    { name = "kit/default", url = "https://ovextensionsprod.blob.core.windows.net/exts/kit/prod/${kit_version_major}/shared" },
    { name = "kit/sdk", url = "https://ovextensionsprod.blob.core.windows.net/exts/kit/prod/sdk/${kit_version_short}/${kit_git_hash}" },
    { name = "kit/community", url = "https://dw290v42wisod.cloudfront.net/exts/kit/community" },
]

########################################################################################################################
# Docs
########################################################################################################################

[repo_docs]
name = "AeroSim Isaac Sim"
project = "aerosim-isaac-sim"
api_output_directory = "api"
use_fast_doxygen_conversion = false

[repo_docs.kit]
extensions = [
    "aerosim.omniverse.extension",
    "cesium.omniverse",
    "cesium.usd.plugins",
]

########################################################################################################################
# Packaging
########################################################################################################################

[repo_package.packages."platform:windows-x86_64".docs]
windows_max_path_length = 0

[repo_symstore]
enabled = false
